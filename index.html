<style>
:root{--ink:#2b2d4a;--pv:#a5b1e8;--cream:#fff6ea;--tan:#dcc6a6;--star:#ffd84a;--blush:#f4b6c2;--txt:#2b2d4a;--b1:#c4cdf7;--b2:#a5b1e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--txt:#f4f1ff;--b1:#3a3e6c;--b2:#2b2d4a}}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","Trebuchet MS",system-ui,sans-serif;font-weight:800;color:var(--txt);background:radial-gradient(circle,rgba(255,255,255,.3) 2.2px,transparent 2.8px) 0 0/20px 20px,linear-gradient(170deg,var(--b1),var(--b2));animation:dots 6s linear infinite;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@keyframes dots{to{background-position:20px 20px,0 0}}
button{font:inherit;color:var(--ink);cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid var(--star);outline-offset:3px}
#app{position:relative;height:100%;max-width:460px;margin:0 auto;overflow:hidden}
.bg{display:none}#stars span{position:absolute;color:var(--star);-webkit-text-stroke:1px var(--ink);animation:tw 3s ease-in-out infinite;pointer-events:none}
@keyframes tw{50%{opacity:.2;transform:scale(.6) rotate(40deg)}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 16px;opacity:0;pointer-events:none;transform:translateY(18px) scale(.98);transition:opacity .35s,transform .35s}
.scr.on{opacity:1;pointer-events:auto;transform:none}
.pill{border:3px solid var(--ink);border-radius:16px;padding:8px 14px;min-height:44px;background:var(--cream);box-shadow:0 4px 0 var(--ink);font-size:14px;transition:transform .1s,box-shadow .1s}
.pill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}.pill.hot{background:var(--star)}
.bar{display:flex;justify-content:space-between;gap:8px}
#welcome{align-items:center;justify-content:center;text-align:center;gap:10px;overflow:hidden}
#welcome::before{content:"";position:absolute;width:220%;aspect-ratio:1;left:-60%;top:50%;margin-top:-110%;background:repeating-conic-gradient(rgba(255,255,255,.28) 0 7deg,transparent 7deg 16deg);animation:spin 50s linear infinite;z-index:0}
@keyframes spin{to{transform:rotate(360deg)}}#welcome>*{position:relative;z-index:1}
.ttl span{display:inline-block;font-size:52px;line-height:1;padding:4px 10px;margin:4px 3px;border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);color:var(--ink);transform:rotate(var(--r));animation:drop .8s cubic-bezier(.3,1.7,.5,1) both;animation-delay:calc(var(--i)*.11s)}
@keyframes drop{from{transform:translateY(-110vh) rotate(calc(var(--r)*4))}}
#sl{position:relative;margin-top:6px;cursor:pointer;animation:fin .6s 1s both}
#wImg{height:210px;transform-origin:50% 100%;animation:sway 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 0 rgba(43,45,74,.25))}
#wImg.woke{animation:wake .8s both}#wImg.poke{animation:poke .4s}
@keyframes sway{50%{transform:rotate(3deg) translateY(4px)}}@keyframes wake{40%{transform:translateY(-40px) scale(1.12) rotate(-6deg)}}@keyframes poke{30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}
.z{position:absolute;right:-6px;top:20px;font-size:26px;color:var(--cream);-webkit-text-stroke:1.5px var(--ink);animation:zz 2.6s linear infinite;opacity:0}.z:nth-of-type(2){animation-delay:.9s;right:10px}.z:nth-of-type(3){animation-delay:1.8s;right:-20px}
@keyframes zz{0%{opacity:0;transform:translate(0,10px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-60px) scale(1.3)}}
#welcome p{margin:0;font-size:16px;animation:fin 1s 1.3s both}#start{font-size:22px;padding:10px 46px;background:var(--star);animation:fin 1s 1.6s both}
@keyframes fin{from{opacity:0;transform:translateY(14px)}}
#wipe{position:fixed;inset:0;background:var(--star);z-index:20;display:none;pointer-events:none}
.dome{position:relative;width:230px;height:230px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 24%,rgba(255,255,255,.95),rgba(255,255,255,.35) 40%,rgba(165,177,232,.5));border:4px solid var(--ink);box-shadow:0 7px 0 var(--ink);animation:float 4s ease-in-out infinite}
.dome img{height:68%}.dome svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s}.dome.crack svg{opacity:1}
@keyframes float{50%{transform:translateY(-9px)}}
.disp{position:relative;margin-top:78px;flex:1;min-height:120px;background:var(--cream);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:8px 16px 10px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;color:var(--ink)}
#dsp::before{content:"";position:absolute;inset:0;border-radius:23px;background:repeating-conic-gradient(from 0deg at 75% 55%,rgba(255,216,74,.95) 0 6deg,transparent 6deg 15deg);opacity:0;pointer-events:none}
#dsp.flash::before{animation:fl .55s}@keyframes fl{0%{opacity:1;transform:scale(1.04)}100%{opacity:0}}
#ex{min-height:24px;font-size:19px;opacity:.65;max-width:100%;overflow:hidden;white-space:nowrap;direction:ltr;position:relative}
#big{font-size:72px;line-height:1.05;max-width:100%;white-space:nowrap;direction:ltr;font-variant-numeric:tabular-nums;position:relative}
#big.pop{animation:slam .45s}#big.err{animation:shake .4s;color:#c0566e}
@keyframes slam{0%{transform:scale(1.5)}60%{transform:scale(.92)}100%{transform:none}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#sfxT{position:absolute;left:14px;top:6px;font-size:38px;color:var(--star);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);opacity:0;pointer-events:none;white-space:nowrap}
#sfxT.go{animation:boom .9s}@keyframes boom{0%{opacity:0;transform:scale(.2) rotate(-24deg)}25%{opacity:1;transform:scale(1.3) rotate(-9deg)}100%{opacity:0;transform:scale(1) rotate(-9deg) translateY(-16px)}}
#comp{position:absolute;right:14px;top:-84px;width:104px;text-align:center;z-index:2}
#comp img{width:92px;display:block;margin:auto;transform-origin:50% 100%;animation:breathe 3.4s ease-in-out infinite;cursor:pointer;filter:drop-shadow(0 4px 0 rgba(43,45,74,.3))}
#comp:not(.free)::after{content:"z Z";position:absolute;right:-4px;top:-2px;font-size:18px;color:var(--cream);-webkit-text-stroke:1.5px var(--ink);animation:zz 2.6s linear infinite}
#comp.hop img{animation:hop .5s}@keyframes breathe{50%{transform:scaleY(1.04) rotate(-3deg)}}@keyframes hop{40%{transform:translateY(-20px) rotate(7deg)}}
#say{position:absolute;right:104px;top:-6px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:5px 10px;font-size:13px;white-space:nowrap;opacity:0;transform:scale(.7);transition:.25s;box-shadow:0 3px 0 var(--ink)}#say.on{opacity:1;transform:none}
#meter{display:flex;gap:8px;justify-content:center;padding:8px 0 2px}#meter i{font-style:normal;font-size:22px;color:var(--star);-webkit-text-stroke:1.5px var(--ink);filter:grayscale(1) opacity(.4);transition:.25s}#meter i.on{filter:none;transform:scale(1.3) rotate(14deg)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,minmax(50px,1fr));gap:10px;height:min(54%,400px);padding:6px 0}
.k{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:20px;font-size:28px;background:var(--cream);color:var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.k:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.k.fn{background:var(--tan)}.k.op{background:var(--pv)}.k.eq{background:var(--star)}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.8);width:12px;height:12px;margin:-6px;animation:rip .45s forwards;pointer-events:none}@keyframes rip{to{transform:scale(10);opacity:0}}
.sp{position:fixed;z-index:9;pointer-events:none;font-size:20px;-webkit-text-stroke:1px var(--ink);animation:sp .8s ease-out forwards}@keyframes sp{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
.sheet{position:absolute;inset:auto 0 0 0;height:62%;background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:28px 28px 0 0;padding:16px;transform:translateY(105%);transition:transform .35s;display:flex;flex-direction:column;gap:10px;z-index:5}
.sheet.on{transform:none}.sheet .l{flex:1;overflow:auto}.hi{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:10px 4px;border-bottom:2px dashed rgba(43,45,74,.3);font-size:18px;text-align:left}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h2{margin:0;font-size:20px}
.arena{position:relative;flex:1;display:grid;place-items:center;min-height:250px}
.lk{position:absolute;font-size:30px;transition:.6s}.lk.open{transform:translateY(-12px) scale(1.3) rotate(-18deg);opacity:.5}
.lk:nth-of-type(1){left:6%;top:10%}.lk:nth-of-type(2){right:6%;top:10%}.lk:nth-of-type(3){left:calc(50% - 15px);bottom:0}
.pz{min-height:190px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:10px}.pz p{margin:0;font-size:17px;max-width:320px}
.pads{display:grid;grid-template-columns:repeat(4,64px);gap:12px}.pad,.gem{border:3px solid var(--ink);border-radius:20px;height:64px;font-size:30px;background:var(--cream);box-shadow:0 5px 0 var(--ink);transition:.15s}
.pad.lit{background:var(--star);transform:translateY(-6px) scale(1.1)}
.gems{display:flex;gap:14px;align-items:center;min-height:80px}.gem{border-radius:50%;padding:0;background:radial-gradient(circle at 32% 28%,#fff,var(--pv) 75%)}.gem.done{background:radial-gradient(circle at 32% 28%,#fff,var(--star) 80%);transform:translateY(3px)}
.hold{width:120px;height:120px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);color:var(--ink);background:conic-gradient(var(--star) calc(var(--p,0)*360deg),var(--cream) 0);position:relative;touch-action:none}
.hold::after{content:attr(data-t);position:absolute;inset:10px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);display:grid;place-items:center}
.sh{position:absolute;width:16px;height:16px;border-radius:50% 50% 50% 0;background:#fff;border:2px solid var(--ink);animation:shard 1s ease-out forwards}@keyframes shard{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.dome.gone{animation:none;opacity:0;transform:scale(1.25);transition:opacity .9s,transform .9s}.dome.gone svg{opacity:0}
.dome.free{animation:none;background:none;border:0;box-shadow:none}.dome.free img{height:100%;animation:breathe 3.4s infinite,slam .8s}
#msg{font-size:26px;color:var(--txt);animation:fin .8s both}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:18px;background:var(--cream);color:var(--ink);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);margin-top:12px}
.row input[type=range]{width:46%;accent-color:#2b2d4a;height:32px}.row input[type=checkbox]{width:48px;height:28px;accent-color:#2b2d4a}.btnw{width:100%;text-align:left}
body.rm *{animation:none!important;transition-duration:.01ms!important}

let S={music:true,mv:.5,sfx:true,sv:.7,rm:matchMedia('(prefers-reduced-motion:reduce)').matches},H=[],G={st:0,freed:false},seen=false;
try{const d=JSON.parse(localStorage.getItem('mizu')||'{}');if(d.S)Object.assign(S,d.S);if(Array.isArray(d.H))H=d.H;if(d.G)G=d.G;seen=!!d.seen}catch(e){}

/* ---------- audio ---------- */
let AC,mg,sg,dl,mtimer=0,step=0,nextT=0;
const mf=m=>440*2**((m-69)/12);
function ac(){if(AC)return AC;try{AC=new(window.AudioContext||window.webkitAudioContext)();mg=AC.createGain();sg=AC.createGain();dl=AC.createDelay(1);dl.delayTime.value=.42;const fb=AC.createGain(),lp=AC.createBiquadFilter();fb.gain.value=.35;lp.frequency.value=1800;dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(mg);mg.connect(AC.destination);sg.connect(AC.destination);vol()}catch(e){AC=null}return AC}
function vol(){if(!AC)return;mg.gain.value=S.music?S.mv*.6:0;sg.gain.value=S.sfx?S.sv:0}
function tone(f,t,d,ty,g,dest,send,att){try{const o=AC.createOscillator(),n=AC.createGain();o.type=ty;o.frequency.value=f;n.gain.setValueAtTime(0,t);n.gain.linearRampToValueAtTime(g,t+(att||.01));n.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(n);n.connect(dest);if(send)n.connect(dl);o.start(t);o.stop(t+d+.05)}catch(e){}}
function sfx(k,n){if(!S.sfx||!ac())return;AC.resume();const t=AC.currentTime,P=[0,2,4,7,9];
 if(k==='d'){const s=P[n%5]+12*Math.floor(n/5);tone(330*2**(s/12),t,.16,'sine',.3,sg)}
 else if(k==='o'){tone(262,t,.12,'triangle',.28,sg);tone(392,t+.05,.14,'triangle',.2,sg)}
 else if(k==='f'){tone(220,t,.12,'sine',.28,sg)}
 else if(k==='eq'){[523,659,784,1047,1319].forEach((f,i)=>tone(f,t+i*.07,.5,'triangle',.22,sg))}
 else if(k==='nav'){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(700,t+.25);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g);g.connect(sg);o.start(t);o.stop(t+.35)}
 else if(k==='err'){tone(160,t,.25,'sawtooth',.12,sg)}
 else if(k==='ok'){[660,880].forEach((f,i)=>tone(f,t+i*.1,.4,'sine',.25,sg))}
 else if(k==='win'){[523,587,659,784,880,1047,1319,1568].forEach((f,i)=>{tone(f,t+i*.16,1.2,'triangle',.22,sg);tone(f*2,t+i*.16,.6,'sine',.08,sg)})}
 else if(k==='n'){tone(mf(60+n*4),t,.4,'sine',.3,sg)}}
const CH=[[57,60,64,67],[53,57,60,64],[60,64,67,71],[55,59,62,66]];
function sched(){while(nextT<AC.currentTime+.5){const ch=CH[Math.floor(step/8)%4],e=step%8;
 if(e===0){ch.forEach(m=>tone(mf(m),nextT,3.4,'sine',.05,mg,0,.7));tone(mf(ch[0]-12),nextT,3,'sine',.1,mg,0,.1)}
 if(Math.random()<.55){const m=ch[Math.random()*4|0]+(Math.random()<.4?12:0);tone(mf(m),nextT,1.4,'triangle',.07,mg,1);tone(mf(m)*2,nextT,.5,'sine',.025,mg,1)}
 if(Math.random()<.08)tone(mf(ch[2]+24),nextT,.6,'sine',.04,mg,1);
 nextT+=.4167;step++}}
function startMusic(){if(!S.music||!ac()||mtimer)return;AC.resume();nextT=AC.currentTime+.1;mtimer=setInterval(sched,150)}

function burst(x,y,n){if(S.rm)n=Math.min(n,2);for(let i=0;i<n;i++){const s=document.createElement('span');s.className='sp';s.textContent=Math.random()<.7?'✦':'♡';s.style.color=['#ffd84a','#fff','#f4b6c2'][i%3];s.style.left=x+'px';s.style.top=y+'px';const a=Math.random()*6.28,r=40+Math.random()*70;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),850)}}

let sayT;function say(t){$('say').textContent=t;$('say').classList.add('on');clearTimeout(sayT);sayT=setTimeout(()=>$('say').classList.remove('on'),1900)}

/* ---------- calculator ---------- */
let expr='',eq=false,lastEx='',combo=0;
const OPS='+−×÷',fmtN=n=>{n=+n.toPrecision(12);if(n!==0&&(Math.abs(n)>=1e15||Math.abs(n)<1e-9))return n.toExponential(6).replace(/\.?0+e/,'e').replace('e+','e');return String(n)};
const grp=s=>s.replace(/^(-?)(\d+)/,(m,a,b)=>a+b.replace(/\B(?=(\d{3})+(?!\d))/g,','));
function lastNum(){return expr.match(/-?[\d.]*%*$/)[0]}
function evalE(s){s=s.replace(/[+−×÷.-]+$/,m=>/^\.$/.test(m)?'':m.replace(/[+−×÷.-]/g,''));const re=/(-?[\d.]+)(%*)|([+−×÷])/g;let m,nums=[],ops=[];
 while((m=re.exec(s))){if(m[3])ops.push(m[3]);else{let v=parseFloat(m[1]);if(isNaN(v))throw 0;v=v/Math.pow(100,m[2].length);nums.push(+v.toPrecision(14))}}
 if(!nums.length)return 0;if(nums.length!==ops.length+1)throw 0;
 const n2=[nums[0]],o2=[];for(let i=0;i<ops.length;i++){if(ops[i]==='×'||ops[i]==='÷'){const a=n2.pop(),b=nums[i+1];if(ops[i]==='÷'&&b===0)throw 1;n2.push(+(ops[i]==='×'?a*b:a/b).toPrecision(12))}else{o2.push(ops[i]);n2.push(nums[i+1])}}
 let r=n2[0];o2.forEach((o,i)=>r=+(o==='+'?r+n2[i+1]:r-n2[i+1]).toPrecision(12));return r}
function render(err){const hasOp=/[+−×÷%]/.test(expr.replace(/^-/,''));let big;
 if(err){big='Error'}else if(expr===''){big='0'}else{try{big=grp(fmtN(evalE(expr)))}catch(e){big=grp(lastNum()||'0')}}
 if(!hasOp&&!err&&expr!=='')big=grp(expr.replace(/%/g,''));
 $('ex').textContent=eq?lastEx+' =':(hasOp?expr:'');const b=$('big');b.textContent=big;const L=big.length;b.style.fontSize=(L>14?30:L>11?40:L>8?52:72)+'px'}
function press(k,x,y){
 if(k>='0'&&k<='9'&&k.length===1){if(eq){expr='';eq=false}const l=lastNum();if(l.endsWith('%')||l.replace('-','').replace('.','').length>=15)return;if(l==='0'||l==='-0')expr=expr.slice(0,-1)+k;else expr+=k;sfx('d',+k)}
 else if(k==='.'){if(eq){expr='';eq=false}const l=lastNum();if(l.includes('.')||l.endsWith('%'))return;expr+=(l===''||l==='-')?'0.':'.';sfx('d',5)}
 else if(OPS.includes(k)){if(expr==='Error')expr='';eq=false;if(expr===''){expr=k==='−'?'-':'0'+k}else if(expr==='-')return;else if(OPS.includes(expr.slice(-1)))expr=expr.slice(0,-1)+k;else{if(expr.endsWith('.'))expr=expr.slice(0,-1);expr+=k}sfx('o')}
 else if(k==='%'){const l=lastNum();if(l===''||l==='-'||l.endsWith('%'))return;eq=false;expr+='%';sfx('f')}
 else if(k==='±'){eq=false;const l=lastNum();expr=l===''?expr+'-':l[0]==='-'?expr.slice(0,expr.length-l.length)+l.slice(1):expr.slice(0,expr.length-l.length)+'-'+l;sfx('f')}
 else if(k==='⌫'){if(eq){expr='';eq=false}else expr=expr.slice(0,-1);sfx('f')}
 else if(k==='AC'){expr='';eq=false;sfx('f')}
 else if(k==='='){if(expr===''||eq||!/[+−×÷%]/.test(expr.replace(/^-/,'')))return;lastEx=expr.replace(/[+−×÷.-]+$/,'');
  try{const r=evalE(expr);const s=fmtN(r).replace('e+','e');expr=/e/.test(s)?String(r):s;eq=true;H.unshift({e:lastEx,r:s});H=H.slice(0,50);save();sfx('eq');render();const b=$('big');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
   combo++;boom(['POP!','ZING!','BOOM!','PYON!'][combo%4]);meter();burstEl(b,Math.abs(r)>=1e6?16:9);hop();say(G.freed?(Math.abs(r)>=1e6?'Whoa!!':['Nice!','So sparkly ✦','You did it ♡','Wow!'][combo%4]):['zzz… free me ♡','mm… numbers…','…more?'][combo%3]);return}
  catch(e){expr='';eq=false;sfx('err');boom('EEK!');render(true);const b=$('big');b.classList.remove('err');void b.offsetWidth;b.classList.add('err');say(G.freed?'Oops! Divide by zero?':'zzz… oops');return}}
 render();if(x!==undefined&&k!=='='&&Math.random()<.5)burst(x,y,2)}
const KS=[['AC','fn'],['⌫','fn'],['%','fn'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['±','fn'],['0'],['.'],['=','eq']];
KS.forEach(([k,c])=>{const b=document.createElement('button');b.className='k '+(c||'');b.textContent=k;b.setAttribute('aria-label',{'⌫':'Delete','AC':'Clear','÷':'Divide','×':'Multiply','−':'Minus','±':'Toggle sign','=':'Equals'}[k]||k);
 b.addEventListener('pointerdown',e=>{ac();const r=b.getBoundingClientRect(),p=document.createElement('span');p.className='rip';p.style.left=e.clientX-r.left+'px';p.style.top=e.clientY-r.top+'px';b.appendChild(p);setTimeout(()=>p.remove(),520);press(k,e.clientX,e.clientY)});
 b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')e.stopPropagation()});$('keys').appendChild(b)});
addEventListener('keydown',e=>{if(cur!=='calc'||$('hist').classList.contains('on'))return;const m={'*':'×','/':'÷','-':'−','Enter':'=','Backspace':'⌫','Escape':'AC'};const k=m[e.key]||e.key;if(/^[0-9.+%=×÷−⌫]$/.test(k)||k==='AC'){e.preventDefault();ac();press(k)}});
/* history */
function rH(){const l=$('hl');l.innerHTML='';if(!H.length){l.innerHTML='<p style="opacity:.7">Your calculations will appear here.</p>';return}H.forEach(h=>{const b=document.createElement('button');b.className='hi';b.innerHTML='<span></span><b></b>';b.children[0].textContent=h.e+' =';b.children[1].textContent=grp(h.r);b.onclick=()=>{expr=h.r.replace(/,/g,'');eq=true;lastEx=h.e;$('hist').classList.remove('on');render();sfx('nav')};l.appendChild(b)})}
$('bHist').onclick=()=>{rH();$('hist').classList.add('on');sfx('nav')};$('hX').onclick=()=>{$('hist').classList.remove('on');sfx('nav')};$('hClr').onclick=()=>{H=[];save();rH();sfx('f')};
function updateComp(){$('compImg').src=G.freed?HAPPY:SLEEP;$('comp').classList.toggle('free',G.freed);$('bFree').textContent=G.freed?'Her room ♡':'FREE HER ♡'}
$('compImg').onclick=e=>{hop();burst(e.clientX,e.clientY,8);sfx('ok');say(G.freed?'Hehe ♡':'zzz… help ♡')};
$('bFree').onclick=()=>go('game');$('bSet').onclick=()=>{syncSet();go('set')};
/* ---------- game ---------- */
let tok=0,pad=[];const SY=['★','♥','◆','●'];
const hint=t=>{const h=$('hint');if(h)h.textContent=t};
function dots(){$('gDots').textContent=G.freed?'♡':'✦'.repeat(G.st)+'🔮'.repeat(3-G.st)}
function enterGame(){tok++;dots();const lk=document.querySelectorAll('.lk');lk.forEach((l,i)=>{l.classList.toggle('open',i<G.st||G.freed);l.textContent=(i<G.st||G.freed)?'✦':'🔮';l.style.display=G.freed?'none':''});
 const d=$('dome');d.className='dome';$('gImg').src=G.freed?HAPPY:SLEEP;
 if(G.freed){d.classList.add('free');$('gT').textContent='Her room ♡';$('pz').innerHTML='<div id="msg">You did it! She\'s free ♡</div><button class="pill" id="gOut">Back to calculator</button>';$('gOut').onclick=()=>go('calc')}
 else{$('gT').textContent='FREE HER ♡';stage()}}
function stage(){const my=tok,z=$('pz');if(G.st===0)m1(my);else if(G.st===1)m2(my);else m3(my)}
function flash(i,my){const p=pad[i];if(!p)return;p.classList.add('lit');sfx('n',[0,1,2,3][i]);setTimeout(()=>p.classList.remove('lit'),420)}
function m1(my){const z=$('pz');z.innerHTML='<p id="hint">Watch the glow…</p><div class="pads">'+SY.map((s,i)=>`<button class="pad" data-i="${i}" aria-label="Symbol ${s}">${s}</button>`).join('')+'</div>';pad=[...z.querySelectorAll('.pad')];
 const seq=Array.from({length:4},()=>Math.random()*4|0);let inp=[],busy=true;
 const play=()=>{busy=true;inp=[];hint('Watch the glow…');seq.forEach((v,i)=>setTimeout(()=>{if(my===tok)flash(v)},700+i*750));setTimeout(()=>{if(my===tok){busy=false;hint('Your turn ♡')}},700+seq.length*750)};
 pad.forEach((p,i)=>p.onclick=()=>{if(busy)return;ac();flash(i);inp.push(i);const n=inp.length-1;if(inp[n]!==seq[n]){busy=true;sfx('err');hint('Not quite — watch again ♡');setTimeout(()=>{if(my===tok)play()},1100)}else if(inp.length===seq.length){busy=true;setTimeout(()=>{if(my===tok)unlock()},500)}});play()}
function m2(my){const z=$('pz'),sz=[26,38,52,68];let o=[...sz].sort(()=>Math.random()-.5);if(o.join()===sz.join())o.reverse();
 z.innerHTML='<p id="hint">Tap the crystals from smallest to largest.</p><div class="gems">'+o.map(s=>`<button class="gem" data-s="${s}" style="width:${s}px;height:${s}px" aria-label="Crystal size ${s}"></button>`).join('')+'</div>';let k=0;const gs=[...z.querySelectorAll('.gem')];
 gs.forEach(g=>g.onclick=()=>{ac();if(+g.dataset.s===sz[k]){g.classList.add('done');sfx('n',k);k++;burstEl(g,3);if(k===4)setTimeout(()=>{if(my===tok)unlock()},500)}else if(!g.classList.contains('done')){k=0;gs.forEach(x=>x.classList.remove('done'));sfx('err');hint('Almost — start again from the smallest ♡')}})}
function m3(my){const z=$('pz');z.innerHTML='<p id="hint">Press and hold to charge the final seal.</p><button class="hold" id="hb" data-t="Hold"></button>';const b=$('hb');let p=0,h=false,last=0,done=false;
 const loop=t=>{if(my!==tok||done)return;const dt=Math.min(50,t-last||16);last=t;p=Math.max(0,Math.min(1,p+(h?dt/1700:-dt/2500)));b.style.setProperty('--p',p);if(h&&Math.random()<.06)sfx('n',Math.floor(p*6));if(p>=1){done=true;unlock();return}requestAnimationFrame(loop)};
 const on=e=>{e.preventDefault();ac();h=true;last=performance.now()};const off=()=>{h=false};b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,off));requestAnimationFrame(loop)}
function unlock(){G.st++;save();dots();const l=document.querySelectorAll('.lk')[G.st-1];if(l){l.classList.add('open');l.textContent='✦'}burstEl($('dome'),12);sfx('ok');
 if(G.st>=3)release();else{$('pz').innerHTML='<p>Lock '+G.st+' opened ♡</p>';const my=tok;setTimeout(()=>{if(my===tok)stage()},1100)}}
function release(){const d=$('dome'),my=tok;$('pz').innerHTML='<p>The bubble is cracking…</p>';d.classList.add('crack');sfx('err');
 setTimeout(()=>{if(my!==tok)return;for(let i=0;i<16;i++){const s=document.createElement('span');s.className='sh';s.style.left='calc(50% - 8px)';s.style.top='calc(50% - 8px)';const a=i/16*6.28,r=90+Math.random()*60;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');d.appendChild(s)}d.classList.add('gone');sfx('win')},900);
 setTimeout(()=>{if(my!==tok)return;d.querySelectorAll('.sh').forEach(s=>s.remove());d.className='dome free';$('gImg').src=HAPPY;G.freed=true;save();updateComp();dots();document.querySelectorAll('.lk').forEach(l=>l.style.display='none');$('gT').textContent='Her room ♡';
  $('pz').innerHTML='<div id="msg">You did it! She\'s free ♡</div><button class="pill" id="gOut">Back to calculator</button>';$('gOut').onclick=()=>go('calc');
  [0,300,600,900].forEach(t=>setTimeout(()=>burstEl(d,16),t))},1900)}
